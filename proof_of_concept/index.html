<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light" />

    <title>TODO</title>

    <style>
        :root {
            --color-primary: hotpink;
        }

        body {
            font-family: sans-serif;
            line-height: 1.5;
        }

        header,
        main,
        form {
            box-sizing: border-box;
            width: min(60ch, 100%);
            margin: auto;
            border-left: 1px solid var(--color-primary);
            border-right: 1px solid var(--color-primary);
            padding: 1ch 2ch;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 1ch;
        }

        button.primary {
            background-color: var(--color-primary);
        }

        button.secondary {
            background-color: transparent;
        }

        :popover-open {
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        ol {
            padding-inline-start: 2ch;
        }

        
        #todo_list li {
            cursor: pointer;
        }

        #todo_list li:hover {
            color: var(--color-primary);
        }

    </style>
    <script>
        function save_item(item) {
            const linux_timestamp = new Date().getTime();
            const json = JSON.stringify(item)
            localStorage.setItem(linux_timestamp, json);
        }

        function load_item(key) {
            const data = localStorage.getItem(key);
            if (!data) return
            return JSON.parse(data)
        }

    </script>
</head>

<body>
    <header>
        <h1>TODO</h1>
        <button class="primary" popovertarget="new_todo" popovertargetaction="open">
            Add Item
        </button>
    </header>
    <main>
        <ol id="todo_list">
            <script>
                (function load_todo() {
                    Object.keys(localStorage).forEach(key => {
                        const list_item = document.createElement("li");
                        list_item.textContent = load_item(key).short
                        list_item.id = key;
                        window.todo_list.appendChild(list_item);
                    })
                })();
            </script>
        </ol>
    </main>
    <form id="new_todo" action="" popover>
        <h2>Add Item</h2>
        <br>
        <label for="short">
            Short Description
        </label>
        <br>
        <input name="short" type="text" id="short" required>
        <br>
        <button class="primary" type="submit">
            Add Item
        </button>
        <button class="secondary" type="button" popovertarget="new_todo" popovertargetaction="close">
            Cancel
        </button>
    </form>
    <script>
        function save_todo(event) {
            event.preventDefault();
            const data = new FormData(this);
            const short = data.get("short");
            save_item({ short })
            this.reset();
            this.hidePopover();
        }

        window.new_todo.addEventListener("submit", save_todo);
    </script>

    <form id="edit_todo" action="" popover>
        <h2>Edit Item</h2>
        <br>
        <label for="short">
            Short Description
        </label>
        <br>
        <input name="short" type="text" id="short" required>
        <br>
        <button class="primary" type="submit">
            Update Item
        </button>
        <button class="secondary" type="button" popovertarget="new_todo" popovertargetaction="close">
            Cancel
        </button>
    </form>
    <script>
        function open_todo(event) {
            console.log(event.target)
            console.log(this)

        }
        window.todo_list.addEventListener("click", open_todo);
    </script>
    


</body>

</html>
