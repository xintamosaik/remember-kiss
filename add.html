{{ define "content" }}
<form id="new_todo" method="POST" action="/add">
    <h2>Add Item</h2>
    <br>
    <label for="short">
        Short Headline
    </label>
    <br>
    <input name="short" type="text" id="short" required>
    <br>
    <button class="primary" type="submit">
        Save
    </button>
    <button class="secondary">
        <a href="index.html">Cancel</a>
    </button>
</form>
{{ end }}
