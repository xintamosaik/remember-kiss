
<form id="new_todo" action="">

        Short Headline

    <br>
    <input name="short" type="text" id="short" required>
    <br>
    <button class="primary" type="submit">
        Save
    </button>
    <button class="secondary">
        <a href="index.html">Cancel</a>
    </button>

<script>
    function save_todo(event) {
        event.preventDefault();
        const data = new FormData(this);
        const short = data.get("short");
        save_item({ short })
        this.reset();
    }

    window.new_todo.addEventListener("submit", save_todo);
</script>
