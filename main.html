{{ define "content" }}
<header>
    <h1>TODO</h1>
    <button class="primary">
        <a href="add.html">Add Item</a>
    </button>
</header>

<main>
    <ol id="todo_list">
        {{ range .Items }}
        <li>
            <a href="edit.html?key={{ .ID }}">{{ .Short }}</a>
            <a href="delete.html?key={{ .ID }}" title="Delete">🗑️</a>
        </li>
        {{ else }}
        <li>No todos yet.</li>
        {{ end }}
    </ol>
</main>
{{ end }}
